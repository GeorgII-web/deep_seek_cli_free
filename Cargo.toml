[package]
name = "deep_seek_cli_free"
version = "0.4.7"
edition = "2024"
description = "CLI agent that runs commands on this machine, driven by the free DeepSeek web account"
license = "MIT"
repository = "https://github.com/GeorgII-web/deep_seek_cli_free"

[[bin]]
name = "dsc"
path = "src/main.rs"

[dependencies]
anyhow = "1.0.104"
base64 = "0.23.1"
clap = { version = "4.6.7", features = ["derive"] }
crossterm = "0.29.0"
directories = "6.0.0"
futures-util = "0.3.34"
libc = "0.2.191"
reqwest = { version = "0.13.5", default-features = false, features = ["rustls", "stream", "json", "gzip", "http2", "multipart"] }
rpassword = "7.5.4"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
tokio = { version = "1.54.1", features = ["rt-multi-thread", "macros", "process", "signal", "time", "io-util", "fs", "sync"] }
toml = "1.2.1"
unicode-width = "0.2.3"
wasmi = { version = "2.0.0", features = ["portable-dispatch"] }

[profile.release]
codegen-units = 1
lto = true
panic = "abort"
strip = true

# The wasm interpreter is unusably slow unoptimized (proof of work takes minutes).
# wasmi needs `portable-dispatch`: its default tail-call dispatch overflows the stack in debug builds.
[profile.dev.package."*"]
opt-level = 3

[package]
name = "deep_seek_cli_free"
version = "0.1.0"
edition = "2024"
description = "CLI agent that runs commands on this machine, driven by the free DeepSeek web account"

[[bin]]
name = "dsc"
path = "src/main.rs"

[dependencies]
anyhow = "1.0.104"
clap = { version = "4.6.7", features = ["derive"] }
directories = "6.0.0"
serde = { version = "1.0.229", features = ["derive"] }
toml = "1.2.1"

[profile.release]
codegen-units = 1
lto = true
panic = "abort"
strip = true
